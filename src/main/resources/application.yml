spring:
  application:
    name: spring-ai-kotlin-rag
  mvc:
    async:
      request-timeout: 2m   # SSE streams run on MVC async; default timeout can cut long answers
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:missing}   # never hardcode; export OPENAI_API_KEY
      chat:
        options:
          model: ${CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: kotlin-docs
        initialize-schema: true

rag:
  top-k: ${RAG_TOP_K:4}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.3}
  session-ttl-minutes: ${RAG_SESSION_TTL_MINUTES:60}
  max-turns: ${RAG_MAX_TURNS:10}
  keep-turns: ${RAG_KEEP_TURNS:6}

logging:
  level:
    # set to DEBUG to see the full RAG prompt incl. retrieved chunks
    org.springframework.ai.chat.client.advisor: ${ADVISOR_LOG_LEVEL:INFO}
    org.springframework.ai.rag: ${ADVISOR_LOG_LEVEL:INFO}
