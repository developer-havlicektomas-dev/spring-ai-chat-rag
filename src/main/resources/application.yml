spring:
  application:
    name: spring-ai-kotlin-rag
  # F8: Postgres = system of record (users, chat sessions + messages, Koog agent memory) and optional vector store.
  # Box: /workspace/tools/postgres/start-postgres.sh; Mac: compose.yaml (Spring Boot docker-compose overrides these).
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${POSTGRES_USER:rag}
    password: ${POSTGRES_PASSWORD:rag}   # local dev default only
  flyway:
    enabled: true   # src/main/resources/db/migration (V1 = Spring AI session schema, V2 = app_user, V3 = agent memory, V4 = study plans + usage)
  mvc:
    async:
      request-timeout: 2m   # SSE streams run on MVC async; default timeout can cut long answers
  # F10: ThreadLocals registered with Micrometer context-propagation (Spring Security's principal, observations)
  # follow suspend controllers (Spring adds PropagationContextElement) and Reactor streams -> LLM usage is booked
  # on the right user even when the model call finishes on another thread.
  reactor:
    context-propagation: auto
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:missing}   # never hardcode; export OPENAI_API_KEY
      # F10: resilience of the OpenAI Java SDK client: per-request timeout + SDK retries with exponential backoff
      # (connection errors, 408/409/429/5xx). Whatever still fails becomes a 503/504 ProblemDetail (ApiExceptionHandler).
      timeout: ${OPENAI_TIMEOUT:60s}
      max-retries: ${OPENAI_MAX_RETRIES:2}
      chat:
        options:
          model: ${CHAT_MODEL:gpt-4o-mini}
          # F10: global answer-size cap for every chat call (Koog, study, agents); /chat answers use rag.limits below
          max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:4096}
      embedding:
        options:
          model: text-embedding-3-small
    # F8: rag.vector-store picks which Spring AI auto-configuration creates the VectorStore bean
    # (Spring AI's own switch: every store auto-config is @ConditionalOnProperty(spring.ai.vectorstore.type=...))
    vectorstore:
      type: ${rag.vector-store}
      pgvector:
        table-name: kotlin_docs
        index-type: hnsw
        distance-type: cosine-distance
        dimensions: 1536          # text-embedding-3-small
        initialize-schema: true   # CREATE EXTENSION vector + table + HNSW index if missing
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        collection-name: kotlin-docs
        initialize-schema: true
    # F8: AI_SESSION* tables come from Flyway (V1__spring_ai_session.sql), not from Spring AI's initializer
    session:
      repository:
        jdbc:
          initialize-schema: never

rag:
  # F10: API key auth (Security.kt). enabled=false = dev mode (X-User-Id trusted as in F8/F9; profile "dev").
  # Keys: only their SHA-256 is configured (scripts/new-api-key.sh). As env vars:
  #   RAG_SECURITY_API_KEYS_0_USER_ID=alice RAG_SECURITY_API_KEYS_0_SHA256=<64 hex> RAG_SECURITY_API_KEYS_0_NAME=alice-laptop
  security:
    enabled: ${RAG_SECURITY_ENABLED:true}
    api-keys: []
  # F10: per-caller token bucket on the LLM endpoints (429 RATE_LIMITED + Retry-After + RateLimit headers)
  rate-limit:
    enabled: ${RAG_RATE_LIMIT_ENABLED:true}
    capacity: ${RAG_RATE_LIMIT_CAPACITY:10}       # burst
    refill-tokens: ${RAG_RATE_LIMIT_REFILL:10}    # ... tokens per refill-period, refilled continuously
    refill-period: ${RAG_RATE_LIMIT_PERIOD:1m}
  # F10: cost guardrails - per-plan daily budget per user (429 BUDGET_EXCEEDED), global daily cap and kill switch (503)
  budget:
    enabled: ${RAG_BUDGET_ENABLED:true}
    kill-switch: ${RAG_LLM_KILL_SWITCH:false}
    global-daily-usd: ${RAG_GLOBAL_DAILY_USD:5.00}
    free:
      daily-tokens: ${RAG_BUDGET_FREE_DAILY_TOKENS:200000}
      daily-usd: ${RAG_BUDGET_FREE_DAILY_USD:0.10}
    pro:
      daily-tokens: ${RAG_BUDGET_PRO_DAILY_TOKENS:2000000}
      daily-usd: ${RAG_BUDGET_PRO_DAILY_USD:2.00}
  limits:
    max-body-bytes: ${RAG_MAX_BODY_BYTES:262144}
    chat-max-completion-tokens: ${RAG_CHAT_MAX_COMPLETION_TOKENS:800}
  # F8: qdrant (default) | pgvector - the store behind RAG, /docs/*, the agents' search tool and evals
  vector-store: ${RAG_VECTOR_STORE:qdrant}
  # F8: jdbc (default, Postgres) | memory (no database; use the "memory" profile, which also turns off the DataSource)
  persistence: ${RAG_PERSISTENCE:jdbc}
  # F8: who calls without an X-User-Id header (F10: dev mode only)
  default-user: ${RAG_DEFAULT_USER:anonymous}
  top-k: ${RAG_TOP_K:4}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.3}
  session-ttl-minutes: ${RAG_SESSION_TTL_MINUTES:10080}   # F8: 7 days now that sessions are persisted
  max-turns: ${RAG_MAX_TURNS:10}
  keep-turns: ${RAG_KEEP_TURNS:6}
  # F3: chunking (re-run POST /kotlin/docs/ingest after changing; the ingest endpoint also takes ?chunkSize=&chunkOverlap=)
  chunk-size: ${RAG_CHUNK_SIZE:800}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:0}
  # F3: Spring AI 2.1 DecisionModel post-processors (OpenAI Decisions API); per request: "rerank" / "decisionFilter"
  rerank:
    enabled: ${RAG_RERANK_ENABLED:false}
    top-n: ${RAG_RERANK_TOP_N:3}
    min-score: ${RAG_RERANK_MIN_SCORE:0.1}
  decision-filter:
    enabled: ${RAG_DECISION_FILTER_ENABLED:false}
    fail-closed: ${RAG_DECISION_FILTER_FAIL_CLOSED:false}
  # F3: "is the retrieved context sufficient?" gate -> labeled general-knowledge fallback instead of a refusal
  sufficiency:
    enabled: ${RAG_SUFFICIENCY_ENABLED:true}
    min-probability: ${RAG_SUFFICIENCY_MIN_PROBABILITY:0.5}
  decision-timeout-seconds: ${RAG_DECISION_TIMEOUT_SECONDS:20}
  # F7: allow-list for the research agent's fetchWebPage tool (https only, host or subdomain)
  web:
    allowed-hosts: ${RAG_WEB_ALLOWED_HOSTS:kotlinlang.org,docs.spring.io,docs.koog.ai,api.koog.ai}
  # F9: AI Study Guide spike (POST /kotlin/study/generate): plan limits, chunking, dev plan switch
  study:
    dev-plan-switch: ${RAG_STUDY_DEV_PLAN_SWITCH:false}   # PUT /kotlin/study/plan (dev only, stand-in for billing)
    chunk-chars: 1200
    window-chars: 12000
    free:
      features: [EXPLANATION, QUIZ]
      difficulties: [EASY, MEDIUM]
      max-quiz-size: 5
      max-note-chars: 6000
      daily-generations: ${RAG_STUDY_FREE_DAILY:3}
    pro:
      features: [EXPLANATION, QUIZ, FLASHCARDS]
      difficulties: [EASY, MEDIUM, HARD]
      max-quiz-size: 15
      max-note-chars: 40000
      daily-generations: ${RAG_STUDY_PRO_DAILY:50}
  # F4: golden-set evals (POST /kotlin/evals/run or ./gradlew evalRag)
  eval:
    # F5: one fixed judge for every compared model (stronger than the answer models; non-reasoning so temperature 0 works)
    judge-model: ${EVAL_JUDGE_MODEL:gpt-4.1}
    # F5: allow-list of answer models (POST /kotlin/chat/ask "model", POST /kotlin/evals/run "models", -PevalModels)
    # with list prices in USD per 1M tokens, standard tier, short context, no cached-input discount.
    # Source: https://platform.openai.com/docs/pricing (fetched 2026-11-20). Leave a price out if you can't verify it:
    # the cost column then says "unknown" instead of guessing. reasoning-effort only applies to gpt-5* / o* models.
    models:
      - { name: gpt-4o-mini,  input-per-1m: 0.15, output-per-1m: 0.60 }
      - { name: gpt-4.1-mini, input-per-1m: 0.40, output-per-1m: 1.60 }
      - { name: gpt-4.1,      input-per-1m: 2.00, output-per-1m: 8.00 }
      - { name: gpt-5-nano,   input-per-1m: 0.05, output-per-1m: 0.40 }
      - { name: gpt-5-mini,   input-per-1m: 0.25, output-per-1m: 2.00 }
      - { name: gpt-5.4-nano, input-per-1m: 0.20, output-per-1m: 1.25 }
      - { name: gpt-5.4-mini, input-per-1m: 0.75, output-per-1m: 4.50 }
      - { name: gpt-5.6-luna, input-per-1m: 0.20, output-per-1m: 1.20 }

# F5: /actuator/metrics/gen_ai.client.token.usage (Spring AI observations -> Micrometer)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  # F10: /actuator/health is public (load balancer / platform checks) but only shows UP/DOWN to anonymous callers;
  # liveness/readiness groups for Kubernetes-style probes: /actuator/health/liveness, /actuator/health/readiness
  endpoint:
    health:
      show-details: never   # status only; DB/Qdrant details are for logs and metrics, not the internet
      probes:
        enabled: true

logging:
  level:
    # set to DEBUG to see the full RAG prompt incl. retrieved chunks
    org.springframework.ai.chat.client.advisor: ${ADVISOR_LOG_LEVEL:INFO}
    org.springframework.ai.rag: ${ADVISOR_LOG_LEVEL:INFO}
    org.springframework.ai.openai.OpenAiDecisionModel: ${DECISION_LOG_LEVEL:INFO}
    # F7: Koog Tracing feature output (every agent event); set KOOG_TRACE_LOG_LEVEL=DEBUG to see it
    koog.trace: ${KOOG_TRACE_LOG_LEVEL:INFO}
